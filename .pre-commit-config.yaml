repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c #   v6.0.0
    hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-json
    - id: check-toml
    - id: check-xml
    - id: detect-private-key
    - id: fix-byte-order-marker
    - id: check-added-large-files

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 3c6e76e10abcae02303212289efed3413350769c # v2.30.6
    hooks:
      - id: pyproject-fmt
        args: ["--keep-full-version", "--no-generate-python-version-classifiers"]

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # v0.17.5
    hooks:
      - id: ruff-check
        args: ["--color", "always"]
      # - id: ruff-format
