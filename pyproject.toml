[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "sonarcal"
description = "Software to facilitate standard-sphere calibration of omni-directional sonars"
readme = "README.md"
keywords = [ "acoustic", "calibration", "sonar" ]
license = { file = "LICENSE" }
authors = [ { name = "Gavin Macaulay" } ]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dynamic = [ "version" ]
dependencies = [
  "arrow",
  "construct",
  "h5py",
  "humanize",
  "matplotlib",
  "natsort",
  "numpy",
  "pandas",
  "pillow",
  "platformdirs",
  "pywin32; platform_system=='Windows'",
  "scipy",
  "sv-ttk"
]
urls.Documentation = "https://aqualyd-limited.github.io/sonarCal/"
urls.Homepage = "https://github.com/Aqualyd-Limited/sonarCal"
urls.Issues = "https://github.com/Aqualyd-Limited/sonarCal/issues"
urls.Repository = "https://github.com/Aqualyd-Limited/sonarCal"
scripts.sonarcal = "sonarcal.controller:main"

[dependency-groups]
dev = [
  "prek>=0.5.3",
  "pytest",
  "ruff>=0.16.7",
  "zensical>=0.0.50",
]

[tool.hatch]
version.source = "vcs"
version.raw-options.local_scheme = "no-local-version"  # otherwise the non-tagged version is not accepted by testpypi
build.targets.wheel.packages = [ "src/sonarcal" ]
build.targets.wheel.force-include.site = "sonarcal/offline-docs"
build.targets.wheel.hooks.custom.path = "docs/hatch_build_docs.py"
build.targets.sdist.force-include.site = "site"
build.targets.sdist.hooks.custom.path = "docs/hatch_build_docs.py"

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
lint.extend-select = [
  "B006", # do not use mutable structures for argument defaults
  "C4",   # Catch incorrect use of comprehensions, dict, list, etc
  "E",    # PyCodeStyle errors
  "F",    # Pyflakes rules
  "FA",   # Enforce from __future__ import annotations
  "FURB", # Suggest more idiomatic Python patterns
  "I",    # Sort imports properly
  "ICN",  # Use common import conventions
  "ISC",  # Good use of string concatenation
  "NPY",  # Some numpy-specific things
  "PTH",  # Use pathlib instead of os.path
  "RET",  # Good return practices
  "SIM",  # Common simplification rules
  "TC",   # Enforce importing certain types in a TYPE_CHECKING block
  "TD",   # Be diligent with TODO comments
  "TID",  # Some good import practices
  "UP",   # Warn if certain things can changed due to newer Python versions
  "W",    # PyCodeStyle warnings
]
lint.ignore = [
  "TD002", # missing todo author
  "TD003", # missing todo link
]

[tool.pytest]
ini_options.testpaths = [
  "tests",
]
ini_options.addopts = [
  "--import-mode=importlib",
]
